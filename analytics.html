<!-- Visit counting for the GitHub Pages site.

     Whatever sits below the marked line goes into index.html only. It is NEVER put into
     whoknewwhom.html, because the published artifact blocks every outbound request
     anyway - see the README. Empty the section and nothing is counted.

     What is on at the moment is Abacus (abacus.jasoncameron.dev): free, no account, no
     cookies, and it stores nothing but the counters themselves. It has separate endpoints
     for counting and for reading, so the numbers can be read back without the reading
     inflating them.

     Three counters are kept:
       site           every visit
       dYYYY-MM-DD    every visit, by day, so the shape over time can be seen
       from-<tag>     visits arriving on a link ending ?from=<tag>
       view-<name>    the first time a visit opens the network, map, timeline or table

     Read one with, for example:
       curl https://abacus.jasoncameron.dev/get/wkw-mcr/site

     If you outgrow it, GoatCounter is free for non-commercial use and gives referrers and
     pages as well; paste its snippet here instead:
       <script data-goatcounter="https://YOURCODE.goatcounter.com/count"
               async src="//gc.zgo.at/count.js"></script>
-->
<!-- ---- paste below this line ---- -->
<script>
(function () {
  /* Counters only: no cookie, no identifier, nothing stored about the visitor. */
  var NS = "https://abacus.jasoncameron.dev/hit/wkw-mcr/";
  function count(key) {
    try {
      if (window.fetch) {
        fetch(NS + key, { mode: "cors", cache: "no-store" }).catch(function () {});
      } else {
        new Image().src = NS + key;
      }
    } catch (e) { /* counting must never break the page */ }
  }
  var d = new Date();
  var day = d.getUTCFullYear() + "-" +
    ("0" + (d.getUTCMonth() + 1)).slice(-2) + "-" + ("0" + d.getUTCDate()).slice(-2);
  count("site");
  count("d" + day);
  var m = /[?&]from=([A-Za-z0-9_-]{1,24})/.exec(window.location.search);
  if (m) { count("from-" + m[1].toLowerCase()); }

  /* Which views get used. The page calls this the first time each one is opened;
     in the artifact the function is simply absent and nothing is called. */
  var seen = {};
  window.__count = function (key) {
    if (seen[key]) return;
    seen[key] = 1;
    count(key);
  };
})();
</script>
